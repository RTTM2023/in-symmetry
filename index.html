<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>In Symmetry</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Jost:wght@400;500;600&display=swap">
<style>
/* Layout: one calm column, white paper, Symmetry orange used for marks and selection only. */
:root{
  --paper:#FFFFFF;
  --mist:#F6F4F1;
  --line:#E4E0DB;
  --ink:#2A2A2B;
  --charcoal:#404041;
  --muted:#6B6A6C;
  --orange:#FF8500;
  --orange-ink:#B85A00;
  --btn:#404041;
  --btn-ink:#FFFFFF;
  --sel:#FF8500;
  --sel-ink:#2A2A2B;
  --focus:#FF8500;
  --tick:#2A2A2B;
  --s1:#3E5770; --s2:#8AA2B9; --s3:#E2DED9; --s4:#FFAA45; --s5:#D96400;
  --good:#2F7D4E; --warn:#B85A00;
  --f-display:"Jost","Futura","Trebuchet MS",sans-serif;
  --f-body:"Inter","Helvetica Neue",Arial,sans-serif;
  --r:2px;
  --logo-dark:block; --logo-light:none;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#1B1B1C; --mist:#242425; --line:#38383A; --ink:#F1EFEC; --charcoal:#E6E4E1; --muted:#A9A7A4;
  --orange:#FF9A2E; --orange-ink:#FFB363; --btn:#FF9A2E; --btn-ink:#1B1B1C; --sel:#FF9A2E; --sel-ink:#1B1B1C;
  --focus:#FF9A2E; --tick:#F1EFEC;
  --s1:#C9D6E2; --s2:#6F8499; --s3:#4A4846; --s4:#B3640E; --s5:#FF9A2E; --good:#6CC08E; --warn:#FFB363;
  --logo-dark:none; --logo-light:block; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#1B1B1C; --mist:#242425; --line:#38383A; --ink:#F1EFEC; --charcoal:#E6E4E1; --muted:#A9A7A4;
  --orange:#FF9A2E; --orange-ink:#FFB363; --btn:#FF9A2E; --btn-ink:#1B1B1C; --sel:#FF9A2E; --sel-ink:#1B1B1C;
  --focus:#FF9A2E; --tick:#F1EFEC;
  --s1:#C9D6E2; --s2:#6F8499; --s3:#4A4846; --s4:#B3640E; --s5:#FF9A2E; --good:#6CC08E; --warn:#FFB363;
  --logo-dark:none; --logo-light:block; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;margin:0}
h1,h2,h3{font-family:var(--f-display);font-weight:500;letter-spacing:.01em;line-height:1.2;text-wrap:balance;margin:0}
h1{font-size:clamp(28px,5vw,40px)}
h2{font-size:22px}
h3{font-size:17px;font-weight:500}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--f-display);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.wrap{max-width:920px;margin:0 auto;padding-inline:20px}

/* Header and footer */
.top{border-bottom:1px solid var(--line);background:var(--paper)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:14px}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand img{height:34px;width:auto}
.brand .logo-dark{display:var(--logo-dark)}
.brand .logo-light{display:var(--logo-light)}
.brand .sep{width:1px;height:28px;background:var(--line)}
.brand .name{font-family:var(--f-display);font-size:18px;font-weight:500;letter-spacing:.04em;white-space:nowrap}
.top .who{font-size:14px;color:var(--muted);text-align:right}
main{padding-block:36px 64px}
.foot{border-top:1px solid var(--line)}
.foot .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 20px;padding-block:18px;font-size:13px;color:var(--muted)}
.rttm{font-family:var(--f-display);letter-spacing:.12em;text-transform:uppercase;font-size:12px;color:var(--charcoal);font-weight:500}

/* Symmetry mark: two half discs either side of a diagonal, used as a section motif */
.mark{display:inline-block;width:14px;height:14px;position:relative;flex:none}
.mark::before,.mark::after{content:"";position:absolute;width:9px;height:9px;border-radius:50%;background:var(--orange)}
.mark::before{left:0;top:0;clip-path:polygon(0 0,75% 0,25% 100%,0 100%)}
.mark::after{right:0;bottom:0;clip-path:polygon(75% 0,100% 0,100% 100%,25% 100%)}

/* Generic blocks */
.stack{display:flex;flex-direction:column;gap:28px}
.section{display:flex;flex-direction:column;gap:16px}
.section-head{display:flex;align-items:center;gap:10px}
.lead{font-size:18px;max-width:62ch}
.note{background:var(--mist);border-left:3px solid var(--orange);padding:14px 16px;border-radius:var(--r);max-width:70ch}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:var(--r);padding:12px 20px;font-weight:600;cursor:pointer;background:var(--btn);color:var(--btn-ink);text-decoration:none}
.btn:hover{filter:brightness(1.12)}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--charcoal);filter:none}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.spinner{padding:60px 0;text-align:center;color:var(--muted)}

/* Progress pips */
.pips{display:flex;gap:4px;flex-wrap:wrap}
.pip{width:18px;height:6px;border-radius:1px;background:var(--line)}
.pip.on{background:var(--orange)}

/* Survey: colleague list */
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.person{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px;border:1px solid var(--line);border-radius:var(--r);background:var(--paper);text-align:left;cursor:pointer;width:100%}
.person:hover:not([disabled]){border-color:var(--charcoal)}
.person[disabled]{cursor:default;background:var(--mist)}
.person .pname{font-weight:600}
.person .state{font-size:13px;color:var(--muted);white-space:nowrap}
.person .state.go{color:var(--orange-ink);font-weight:600}
.person .state.done{color:var(--good);font-weight:600}

/* Survey: rating */
#ratebar-slot{position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.ratebar{background:var(--paper);border-bottom:1px solid var(--line)}
.ratebar .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;padding-block:12px}
.ratebar .who{font-family:var(--f-display);font-size:18px;font-weight:500}
.track{height:4px;background:var(--line);width:100%}
.track > i{display:block;height:100%;background:var(--orange);transition:width .25s}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.step{font-size:12px;padding:4px 10px;border:1px solid var(--line);border-radius:var(--r);color:var(--muted);background:transparent;cursor:pointer}
.step.cur{border-color:var(--charcoal);color:var(--ink);font-weight:600}
.step.full{color:var(--ink)}
.q{border:0;margin:0;padding:20px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr;gap:14px;min-width:0}
.q legend{padding:0;display:flex;gap:12px;font-size:17px;line-height:1.45;float:left;width:100%}
.q legend .n{font-family:var(--f-display);color:var(--muted);min-width:22px}
.q.missing legend{color:var(--warn)}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;clear:both}
.scale label{position:relative;display:flex;align-items:center;justify-content:center;text-align:center;min-height:48px;padding:6px 4px;border:1px solid var(--line);border-radius:var(--r);font-size:13px;line-height:1.25;cursor:pointer;background:var(--paper)}
.scale label:hover{border-color:var(--charcoal)}
.scale input{position:absolute;opacity:0;pointer-events:none}
.scale input:checked + span{font-weight:600}
.scale label:has(input:checked){background:var(--sel);border-color:var(--sel);color:var(--sel-ink)}
.scale label:has(input:focus-visible){outline:3px solid var(--focus);outline-offset:2px}
.navrow{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:24px}
.confirm{border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:14px;background:var(--mist)}

/* Dashboards */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:28px;align-items:end}
.big{font-family:var(--f-display);font-size:72px;font-weight:500;line-height:1;letter-spacing:-.01em}
.big small{font-size:22px;color:var(--muted);margin-left:4px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.tile{border-top:3px solid var(--charcoal);padding-top:10px;display:flex;flex-direction:column;gap:4px;min-width:0}
.tile .tname{font-size:13px;color:var(--muted);min-height:2.5em}
.tile .tscore{font-family:var(--f-display);font-size:30px;font-weight:500;line-height:1.1}
.tile .tsub{font-size:13px;color:var(--muted)}
.delta.up{color:var(--good)} .delta.down{color:var(--warn)}

.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-block;width:12px;height:12px;border-radius:2px}
.sw.tick{width:3px;height:14px;background:var(--tick);border-radius:0}

/* Value comparison bars on a 1-5 axis */
.vbars{display:flex;flex-direction:column;gap:14px}
.vbar{display:grid;grid-template-columns:minmax(0,180px) minmax(0,1fr) 48px;gap:14px;align-items:center}
.vbar .lab{font-size:14px}
.plot{position:relative;height:22px;background:linear-gradient(to right,var(--line) 1px,transparent 1px) 0 0/25% 100%;border-right:1px solid var(--line)}
.plot .bar{position:absolute;left:0;top:4px;bottom:4px;background:var(--orange);border-radius:0 4px 4px 0}
.plot .tk{position:absolute;top:0;bottom:0;width:3px;margin-left:-1.5px;background:var(--tick)}
.axis{display:grid;grid-template-columns:minmax(0,180px) minmax(0,1fr) 48px;gap:14px;font-size:12px;color:var(--muted)}
.axis .ticks{display:flex;justify-content:space-between}

/* Distribution bars */
.dist{display:flex;gap:2px;height:14px;width:100%;min-width:0}
.dist i{display:block;height:100%;position:relative}
.dist i:first-child{border-radius:4px 0 0 4px}
.dist i:last-child{border-radius:0 4px 4px 0}
.c1{background:var(--s1)}.c2{background:var(--s2)}.c3{background:var(--s3)}.c4{background:var(--s4)}.c5{background:var(--s5)}

.ranked{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.rlist{list-style:none;padding:0;margin:0;display:flex;flex-direction:column}
.rlist li{display:grid;grid-template-columns:28px minmax(0,1fr) 44px;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);align-items:baseline}
.rlist .rk{font-family:var(--f-display);color:var(--muted)}
.rlist .rv{font-size:12px;color:var(--muted);display:block}
.rlist .sc{text-align:right;font-weight:600}

.vgroup{display:flex;flex-direction:column}
.vgroup h3{padding:18px 0 8px;border-bottom:2px solid var(--charcoal);display:flex;justify-content:space-between;gap:12px}
.qrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(120px,200px) 52px;gap:16px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.qrow .qt{font-size:14px}
.qrow .qs{text-align:right}
.qrow .qs b{display:block;font-size:16px}
.qrow .qs span{font-size:12px;color:var(--muted)}
.qhead{display:grid;grid-template-columns:minmax(0,1fr) minmax(120px,200px) 52px;gap:16px;font-size:12px;color:var(--muted);padding-top:6px}
.qhead span:last-child{text-align:right}

/* MD */
.ctable{width:100%;border-collapse:collapse;font-size:14px}
.ctable td{padding:10px 0;border-bottom:1px solid var(--line);vertical-align:middle}
.ctable td:last-child{text-align:right;width:70px}
.bands{display:flex;gap:2px;height:10px;margin-top:6px}
.bands i{display:block;height:100%}
.bands .bh{background:var(--s5)}.bands .bm{background:var(--s3)}.bands .bl{background:var(--s1)}
.bandtxt{font-size:12px;color:var(--muted)}

.tip{position:fixed;z-index:50;pointer-events:none;background:var(--ink);color:var(--paper);font-size:12px;padding:6px 9px;border-radius:var(--r);max-width:240px;line-height:1.4}

/* Demo hub */
.demo-tag{display:inline-block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border:1px solid var(--orange);color:var(--orange-ink);border-radius:var(--r)}
.views{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.view{border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:10px;text-align:left;background:var(--paper);cursor:pointer}
.view:hover{border-color:var(--charcoal)}
.view h3{font-size:18px}
.view p{font-size:14px;color:var(--muted)}
.backlink{background:none;border:0;padding:0;color:var(--muted);cursor:pointer;font-size:14px;text-decoration:underline;text-underline-offset:3px}

@media (max-width:760px){
  .hero{grid-template-columns:1fr}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ranked{grid-template-columns:1fr}
  .views{grid-template-columns:1fr}
  .vbar,.axis{grid-template-columns:minmax(0,96px) minmax(0,1fr) 40px;gap:10px}
  .qrow,.qhead{grid-template-columns:minmax(0,1fr) 52px}
  .qrow .dist{grid-column:1 / -1;order:3}
  .qhead span:nth-child(2){display:none}
  .big{font-size:56px}
  .brand .name{font-size:16px}
  .brand img{height:28px}
  .top .who{display:none}
  .ratebar .wrap{padding-block:8px;gap:6px 12px}
  .ratebar .eyebrow{display:none}
  .steps{order:3;width:100%;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .step{white-space:nowrap}
}
@media (max-width:480px){
  .scale{grid-template-columns:1fr}
  .scale label{min-height:42px;justify-content:flex-start;padding-inline:14px;font-size:14px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<main><div class="wrap" id="demobar"></div><div class="wrap" id="app"><div class="spinner">Loading</div></div></main>
<footer class="foot">
  <div class="wrap">
    <span>Your ratings are anonymous. Leaders only ever see averages from at least three colleagues.</span>

<script>
/* ------------------------------------------------------------------ */
/* CONFIG: paste the Apps Script web app address between the quotes.  */
/* Leave it empty to run the demo with sample data.                   */
/* ------------------------------------------------------------------ */
var CONFIG = {
  API_URL: ''
};

(function () {
  'use strict';
  var app = document.getElementById('app');
  var who = document.getElementById('who');
  var ratebarSlot = document.getElementById('ratebar-slot');
  var tip = document.getElementById('tip');
  var DEMO = !CONFIG.API_URL;
  var api = DEMO ? demoApi() : liveApi(CONFIG.API_URL);

  /* ---------- small helpers ---------- */
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function fmt(x) { return x == null ? 'n/a' : Number(x).toFixed(1); }
  function pct(score) { return Math.max(0, Math.min(100, (score - 1) / 4 * 100)); }
  function firstName(n) { return String(n).split(' ')[0]; }
  function fill(text, name) { return String(text).replace(/\{name\}/g, firstName(name)); }
  // Dashboards show the behaviour on its own: "{name} listens" becomes "Listens".
  function bare(text) {
    var t = String(text).replace(/^\s*\{name\}\s+/, '').replace(/\{name\}/g, 'this leader');
    return t.charAt(0).toUpperCase() + t.slice(1);
  }
  function store(key, val) { try { if (val === undefined) return JSON.parse(localStorage.getItem(key) || 'null'); if (val === null) localStorage.removeItem(key); else localStorage.setItem(key, JSON.stringify(val)); } catch (e) { return null; } }
  function setTitle(t, sub) { if (t) document.getElementById('appname').textContent = t; document.title = t || 'In Symmetry'; }
  function loading(msg) { ratebarSlot.innerHTML = ''; app.innerHTML = '<div class="spinner">' + esc(msg || 'Loading') + '</div>'; }
  function errorView(msg) { ratebarSlot.innerHTML = ''; app.innerHTML = '<div class="stack"><h1>Something needs attention</h1><p class="lead">' + esc(msg) + '</p><p class="muted">If this keeps happening, contact Run to the Monster and include this message.</p></div>'; }
  function top() { window.scrollTo(0, 0); }

  /* tooltip for chart marks */
  document.addEventListener('mouseover', function (e) {
    var t = e.target.closest && e.target.closest('[data-tip]');
    if (!t) { tip.hidden = true; return; }
    tip.textContent = t.getAttribute('data-tip'); tip.hidden = false;
  });
  document.addEventListener('mousemove', function (e) {
    if (tip.hidden) return;
    var x = Math.min(e.clientX + 14, window.innerWidth - tip.offsetWidth - 8);
    tip.style.left = x + 'px'; tip.style.top = (e.clientY + 16) + 'px';
  });

  /* ---------- routing ---------- */
  var params = new URLSearchParams(location.search);
  if (DEMO) demoHub();
  else if (params.get('s')) loadSurvey(params.get('s'));
  else if (params.get('r')) loadReport(params.get('r'));
  else { app.innerHTML = '<div class="stack"><h1>Welcome</h1><p class="lead">Please open the personal link you received by email. Each leader has their own link for the survey and another for their results.</p></div>'; }

  /* ================================================================== */
  /* SURVEY                                                             */
  /* ================================================================== */
  var S = null; // survey state

  function loadSurvey(code) {
    loading();
    api.survey(code).then(function (d) {
      if (d.error) return errorView(d.error);
      S = { code: code, data: d };
      setTitle(d.title);
      who.textContent = d.name;
      surveyHome();
    }).catch(function () { errorView('We could not reach the survey. Check your connection and refresh the page.'); });
  }

  function surveyHome(flash) {
    ratebarSlot.innerHTML = '';
    var d = S.data, done = d.colleagues.filter(function (c) { return c.done; }).length, total = d.colleagues.length;
    var pips = d.colleagues.map(function (c) { return '<i class="pip' + (c.done ? ' on' : '') + '"></i>'; }).join('');
    var list = d.colleagues.map(function (c) {
      var draft = store('sym:' + S.code + ':' + c.id);
      var state = c.done ? '<span class="state done">Done</span>'
        : (draft ? '<span class="state go">Continue</span>' : '<span class="state go">Start</span>');
      return '<button class="person" data-id="' + esc(c.id) + '"' + (c.done || !d.open ? ' disabled' : '') + '>' +
        '<span class="pname">' + esc(c.name) + '</span>' + state + '</button>';
    }).join('');

    var intro;
    if (!d.open && done < total) intro = '<div class="note">The survey is now closed. Thank you for the ratings you gave.</div>';
    else if (done === total) intro = '<div class="note"><b>All done.</b> You have rated all ' + total + ' colleagues. Thank you, there is nothing more you need to do.</div>';
    else intro = '<p class="lead">Rate each colleague on how they live the four values. Choose a name to begin. Each one takes about five minutes, and you can do them one at a time over several sittings.</p>';

    app.innerHTML =
      '<div class="stack">' +
        '<div class="section">' +
          '<span class="eyebrow">' + esc(d.subtitle || 'Leadership Values 360') + '</span>' +
          '<h1>Hello ' + esc(firstName(d.name)) + '</h1>' +
          (flash ? '<div class="note">' + esc(flash) + '</div>' : '') +
          intro +
        '</div>' +
        '<div class="section">' +
          '<div class="row" style="justify-content:space-between">' +
            '<h2>Your colleagues</h2>' +
            '<div class="row"><div class="pips" aria-hidden="true">' + pips + '</div><span class="num muted" style="font-size:14px">' + done + ' of ' + total + ' complete</span></div>' +
          '</div>' +
          '<div class="people">' + list + '</div>' +
        '</div>' +
        '<div class="section">' +
          '<h2>Before you start</h2>' +
          '<ul class="muted" style="margin:0;padding-left:18px;max-width:66ch;display:flex;flex-direction:column;gap:6px">' +
            '<li>Answer from what you have seen this person do, not what you think they intend.</li>' +
            '<li>Your name is never attached to your ratings. Each leader sees only the average across colleagues.</li>' +
            '<li>Your answers save on this device as you go, so you can stop and come back.</li>' +
            '<li>Once you submit for a colleague, those ratings are final.</li>' +
          '</ul>' +
        '</div>' +
      '</div>';
    app.querySelectorAll('.person:not([disabled])').forEach(function (b) {
      b.addEventListener('click', function () { startRating(b.getAttribute('data-id')); });
    });
    top();
  }

  function startRating(id) {
    var c = S.data.colleagues.filter(function (x) { return x.id === id; })[0];
    var key = 'sym:' + S.code + ':' + id;
    S.cur = { c: c, key: key, answers: store(key) || {}, step: 0, confirm: false };
    renderStep();
  }

  function answeredCount() {
    var n = 0; S.data.values.forEach(function (v) { v.questions.forEach(function (q) { if (S.cur.answers[q.id]) n++; }); }); return n;
  }
  function totalQ() { return S.data.values.reduce(function (a, v) { return a + v.questions.length; }, 0); }
  function stepComplete(i) { return S.data.values[i].questions.every(function (q) { return S.cur.answers[q.id]; }); }

  function renderRatebar() {
    var n = answeredCount(), t = totalQ();
    var steps = S.data.values.map(function (v, i) {
      return '<button class="step' + (i === S.cur.step && !S.cur.confirm ? ' cur' : '') + (stepComplete(i) ? ' full' : '') + '" data-step="' + i + '">' + esc(v.name) + '</button>';
    }).join('');
    ratebarSlot.innerHTML =
      '<div class="ratebar"><div class="wrap">' +
        '<div><div class="eyebrow">Rating</div><div class="who">' + esc(S.cur.c.name) + '</div></div>' +
        '<div class="steps">' + steps + '</div>' +
        '<div class="num muted" style="font-size:14px">' + n + ' of ' + t + ' answered</div>' +
      '</div><div class="track"><i style="width:' + (n / t * 100) + '%"></i></div></div>';
    ratebarSlot.querySelectorAll('.step').forEach(function (b) {
      b.addEventListener('click', function () { S.cur.step = +b.getAttribute('data-step'); S.cur.confirm = false; renderStep(); });
    });
  }

  function renderStep(highlight) {
    renderRatebar();
    if (S.cur.confirm) return renderConfirm();
    var v = S.data.values[S.cur.step], scale = S.data.scale, last = S.cur.step === S.data.values.length - 1;
    var qs = v.questions.map(function (q, i) {
      var missing = highlight && !S.cur.answers[q.id];
      var opts = scale.map(function (lab, k) {
        var val = k + 1, id = 'q_' + q.id + '_' + val;
        return '<label for="' + id + '"><input type="radio" id="' + id + '" name="q_' + q.id + '" value="' + val + '"' + (S.cur.answers[q.id] === val ? ' checked' : '') + '><span>' + esc(lab) + '</span></label>';
      }).join('');
      return '<fieldset class="q' + (missing ? ' missing' : '') + '" id="f_' + q.id + '"><legend><span class="n num">' + (i + 1) + '</span><span>' + esc(fill(q.text, S.cur.c.name)) + '</span></legend><div class="scale">' + opts + '</div></fieldset>';

    app.innerHTML =
      '<div class="stack">' +

          '<p class="muted">How much do you agree with each statement about ' + esc(firstName(S.cur.c.name)) + '?</p>' +
          (highlight ? '<div class="note">Please answer the highlighted questions to continue.</div>' : '') +
        '</div>' +
        '<form id="qform" novalidate>' + qs +
          '<div class="navrow">' +
            '<button type="button" class="btn ghost" id="back">' + (S.cur.step === 0 ? 'Back to colleagues' : 'Previous value') + '</button>' +
            '<button type="submit" class="btn">' + (last ? 'Review and submit' : 'Next value') + '</button>' +
          '</div>' +
        '</form>' +
      '</div>';
    var form = document.getElementById('qform');
    form.addEventListener('change', function (e) {
      if (e.target.type !== 'radio') return;
      S.cur.answers[e.target.name.slice(2)] = +e.target.value;
      store(S.cur.key, S.cur.answers);
      var f = e.target.closest('fieldset'); if (f) f.classList.remove('missing');
      renderRatebar();
    });
    document.getElementById('back').addEventListener('click', function () {
      if (S.cur.step === 0) return surveyHome();
      S.cur.step--; renderStep(); top();
    });
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      if (!stepComplete(S.cur.step)) {
        renderStep(true);
        var first = S.data.values[S.cur.step].questions.filter(function (q) { return !S.cur.answers[q.id]; })[0];
        var el = document.getElementById('f_' + first.id); if (el) el.scrollIntoView({ block: 'center' });
        return;
      }
      if (last) { S.cur.confirm = true; } else { S.cur.step++; }
      renderStep(); top();
    });
    if (!highlight) top();
  }

  function renderConfirm() {
    var incomplete = S.data.values.map(function (v, i) { return stepComplete(i) ? null : v.name; }).filter(Boolean);
    var name = S.cur.c.name;
    app.innerHTML =
      '<div class="stack">' +
        '<div class="section"><span class="eyebrow">Last step</span><h1>Submit your ratings for ' + esc(name) + '</h1></div>' +

  function distBar(dist, scale) {
    var n = dist.reduce(function (a, b) { return a + b; }, 0);
    if (!n) return '<div class="dist"></div>';
    return '<div class="dist" role="img" aria-label="' + esc(dist.map(function (c, i) { return c + ' ' + scale[i]; }).join(', ')) + '">' +
      dist.map(function (c, i) {
        if (!c) return '';
        return '<i class="c' + (i + 1) + '" style="flex:' + c + '" data-tip="' + esc(scale[i] + ': ' + c + (c === 1 ? ' rating' : ' ratings')) + '"></i>';
      }).join('') + '</div>';
  }
  function scaleLegend(scale) {
    return '<div class="legend">' + scale.map(function (s, i) { return '<span><i class="sw c' + (i + 1) + '"></i>' + esc(s) + '</span>'; }).join('') + '</div>';
  }
  function axis() {
    return '<div class="axis" aria-hidden="true"><span></span><div class="ticks num"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span></div><span></span></div>';
  }
  function groupByValue(qs) {
    var order = [], g = {};
    qs.forEach(function (q) { if (!g[q.value]) { g[q.value] = []; order.push(q.value); } g[q.value].push(q); });
    return order.map(function (k) { return { name: k, qs: g[k] }; });
  }
  function ranked(qs, key, dir, n) {
    return qs.filter(function (q) { return q[key] != null; }).slice().sort(function (a, b) { return dir * (b[key] - a[key]); }).slice(0, n);
  }
  function rlist(items, valFn) {
    return '<ol class="rlist">' + items.map(function (q, i) {
      return '<li><span class="rk num">' + (i + 1) + '</span><span>' + esc(bare(q.text)) + '<span class="rv">' + esc(q.value) + '</span></span><span class="sc num">' + valFn(q) + '</span></li>';

            var all = responses.filter(function (x) { return x.qid === q.id; }).map(function (x) { return x.score; });
            return { id: q.id, value: q.value, text: q.text, avg: teamQ[q.id], dist: dist(all), spread: r2(sd(all)) };
          });
          var comp = NAMES.map(function (n, r) { var c = {}; responses.forEach(function (x) { if (x.rater === r) c[x.ratee] = 1; }); return { name: n, done: Object.keys(c).length, total: NAMES.length - 1 }; });
          return wait({ type: 'md', title: 'In Symmetry', subtitle: 'Leadership Values 360', scale: SCALE, open: true, released: true, minRaters: 3,
            completion: comp, totals: { done: comp.reduce(function (a, c) { return a + c.done; }, 0), expected: NAMES.length * (NAMES.length - 1) },
            leadersIncluded: NAMES.length, leadersTotal: NAMES.length, overall: r2(mean(qs.map(function (q) { return q.avg; }))), questions: qs,
            values: byValue(qs, function (vq, vn) {
              var b = { high: 0, mid: 0, low: 0 };
              NAMES.forEach(function (_, t) { var s = mean(vq.map(function (q) { return mean(scoresFor(t, q.id)); })); if (s >= 4) b.high++; else if (s < 3) b.low++; else b.mid++; });
              return { score: r2(mean(vq.map(function (q) { return q.avg; }))), bands: b };
            }) });
        }
        var t = 1;
        var qs2 = questions.map(function (q) { var l = scoresFor(t, q.id); return { id: q.id, value: q.value, text: q.text, avg: r2(mean(l)), dist: dist(l), team: teamQ[q.id] }; });
        return wait({ type: 'leader', title: 'In Symmetry', subtitle: 'Leadership Values 360', name: 'Example leader', scale: SCALE, released: true, raters: NAMES.length - 1, minRaters: 3,
          overall: r2(mean(qs2.map(function (q) { return q.avg; }))), teamOverall: r2(mean(qs2.map(function (q) { return q.team; }))), questions: qs2,
          values: byValue(qs2, function (vq) { return { score: r2(mean(vq.map(function (q) { return q.avg; }))), team: r2(mean(vq.map(function (q) { return q.team; }))) }; }) });
      }
    };
  }
})();
